<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>JAVASCRIPT VARIABLE</title>
<script>
	var x=10;
	document.write(x);
	document.write(typeof x);
	document.write("<br/>");
	var per=90.5;
	document.write(per);
	document.write(typeof per);
	document.write("<br/>");
	var nm='AYAN';
	document.write(nm);
	document.write(typeof nm);
	document.write("<br/>");
	var isMarried=false;
	document.write(isMarried);
	document.write(typeof isMarried);
	document.write("<br/>");
	var state;
	document.write(state);
	document.write(typeof state);
	document.write("<br/>");
	var  dist=null;
	document.write(dist);
	document.write(typeof dist);
	document.write("<br/>");
	var arr=[100,200,300,400,'ajoy'];
	document.write(arr);
	document.write(typeof arr);
	document.write("<br/>");
	var  obj={
		id:1,
		name:'SUMAN',
		dept:'FINANCE'
		}
		document.write(obj.id,obj.name,obj.dept);
	document.write(typeof obj);
	document.write("<br/>");
</script>
</head>
<body>

</body>
</html>
