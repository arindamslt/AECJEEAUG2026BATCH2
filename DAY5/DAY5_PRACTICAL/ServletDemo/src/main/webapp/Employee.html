<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>EMPLOYEE PAGE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>
<body>
<div style="width: 30%;margin:50px auto;">
	<h2 class="text-primary">EMPLOYEE FORM</h2>
	<form action="EmployeeServe" >
	<input type="text" name="eid" class="form-control" placeholder="ENTER YOUR ID"/>
	<input type="text" name="ename" class="form-control" placeholder="ENTER YOUR NAME"/>		
	<select name="edesig" class="form-select">
		<option value="">CHOOSE DESIGNATION</option>
		<option value="MANAGER">MANAGER</option>
		<option value="CLERK">CLERK</option>
		<option value="ANALYST">ANALYST</option>
		<option value="HR">HR</option>
	</select>
	<select name="edept" class="form-select">
		<option value="">CHOOSE DEPARTMENT</option>
		<option value="MKTG">MKTG</option>
		<option value="FINANCE">FINANCE</option>
		<option value="OPRN">OPRN</option>
		<option value="IT">IT</option>
	</select>
	<input type="submit" class="btn btn-outline-primary" value="REGISTER"/>
	</form>
</div>
</body>
</html>
